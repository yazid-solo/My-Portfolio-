<!DOCTYPE html>
<html lang="id" data-accent="cyan">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hubungi Muchamad Yazid Ardani — tersedia untuk kolaborasi, diskusi teknologi, dan peluang magang.">
  <title>Portfolio Yazid · Contact</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-inject"></div>

  <main>
    <!-- ========== PAGE HERO ========== -->

        </div>
      </div>
    </section>

    <!-- ========== 3D MAP CARD ========== -->
    <section style="padding:4rem 0 6rem;background:var(--bg2);perspective:1200px;">
      <div class="container reveal">
        <div class="glass-card tilt-card" style="padding:1.5rem;overflow:hidden;border:1px solid rgba(255,255,255,0.05);transform-style:preserve-3d;">
          <div style="transform:translateZ(30px);position:absolute;top:2.5rem;left:2.5rem;background:rgba(15,23,42,0.7);backdrop-filter:blur(12px);padding:1rem 1.5rem;border-radius:12px;border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:1rem;pointer-events:none;z-index:10;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <div>
              <div style="font-size:0.75rem;color:var(--text-dim);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:0.1rem;" data-i18n="con_card_loc">Lokasi</div>
              <div style="font-size:0.95rem;font-weight:600;color:#fff;">Yogyakarta, Indonesia</div>
            </div>
          </div>
          <div style="transform:translateZ(10px);border-radius:14px;overflow:hidden;height:350px;border:1px solid rgba(255,255,255,0.03);position:relative;background:var(--bg);">
            <div style="position:absolute;inset:0;background:rgba(0,0,0,0.1);pointer-events:none;z-index:5;"></div>
            <iframe 
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d104754.94515539042!2d110.27355806742433!3d-7.788043147165953!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e7a59d8b717500d%3A0xd1d3c0f0864f823!2sDipo%20Kost!5e1!3m2!1sid!2sid!4v1776742848948!5m2!1sid!2sid"
              width="100%" 
              height="350" 
              style="border:0;filter:invert(100%) hue-rotate(180deg) brightness(0.85) contrast(1.15) grayscale(20%);" 
              allowfullscreen="" 
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              title="Lokasi: Banyuraden, Gamping, Sleman, Yogyakarta"
            ></iframe>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="footer-inject"></div>

  <script src="js/i18n.js"></script>
  <script src="data/profile.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js" defer></script>
  <script src="js/intro.js"></script>

  <style>
    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 0 40px; }
    }
    
    .contact-item:hover {
      border-color: rgba(var(--accent-rgb), 0.5) !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .contact-item:hover .contact-bg-glow {
      opacity: 1 !important;
    }
    
    .social-3d {
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .social-3d::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
      opacity: 0; transition: opacity 0.3s;
    }
    .social-3d:hover {
      border-color: rgba(255,255,255,0.2) !important;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    .social-3d:hover::before { opacity: 1; }

    /* Modern Input Fields */
    .modern-input-group {
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .modern-input {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 1.5rem 1rem 0.5rem;
      color: #fff;
      font-family: var(--font-main);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.25,0.8,0.25,1);
      width: 100%;
    }
    .modern-label {
      position: absolute;
      left: 1rem;
      top: 1.15rem;
      font-size: 0.9rem;
      font-family: var(--font-main);
      color: var(--text-muted);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.25,0.8,0.25,1);
    }
    .modern-input:focus,
    .modern-input:not(:placeholder-shown) {
      border-color: rgba(var(--accent-rgb), 0.5);
      background: rgba(255,255,255,0.05);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1);
    }
    .modern-input:focus ~ .modern-label,
    .modern-input:not(:placeholder-shown) ~ .modern-label {
      transform: translateY(-12px) scale(0.8);
      transform-origin: left top;
      color: var(--accent);
    }

    @media(max-width:992px){
      .contact-grid { grid-template-columns: 1fr !important; }
      .form-row-2 { grid-template-columns: 1fr !important; }
    }
  </style>
</body>
</html>
